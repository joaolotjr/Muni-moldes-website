# Garage: armazenamento de objetos compatível com S3, usado para as fotos dos moldes.
# Configuração de um nó só, para desenvolvimento. Os segredos NÃO ficam aqui:
# vêm das variáveis GARAGE_RPC_SECRET e GARAGE_ADMIN_TOKEN (arquivo .env na raiz).

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

# Um nó só: sem réplicas.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
