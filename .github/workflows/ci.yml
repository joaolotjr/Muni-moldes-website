# Verificações automáticas: rodam em todo pull request para o main e a cada push no main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Um novo push no mesmo PR cancela a verificação anterior, que ficou desatualizada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-moldes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend-moldes/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Informativo: mostra alertas, mas não bloqueia o PR. Há alertas sem correção
      # publicada (ex.: picomatch, GHSA-fc5q-39xc-vjpf) que bloqueariam tudo.
      - name: Vulnerabilidades altas em dependências de produção
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-moldes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend-moldes/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Build
        run: npm run build
      - name: Testes
        run: npm test
      # Informativo: mostra alertas, mas não bloqueia o PR. Há alertas sem correção
      # publicada (ex.: picomatch, GHSA-fc5q-39xc-vjpf) que bloqueariam tudo.
      - name: Vulnerabilidades altas em dependências de produção
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
